name: dsh-image
on:
  workflow_dispatch:
  push:
    branches: [feature/D2-policy-v2]
    paths:
      - agents/dsh/**
      - .github/workflows/dsh-image.yml
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: agents/dsh
          platforms: linux/arm64
          push: true
          tags: ghcr.io/klorq/sandbox-dsh:0.2.1-rc.5
